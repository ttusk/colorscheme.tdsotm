# The Dark Side of the Moon adaptive tmux palette.
if-shell 'defaults read -g AppleInterfaceStyle 2>/dev/null | grep -q Dark' \
    'set -g @theme_bg "#111111"; set -g @theme_fg "#f1f1f1"; set -g @theme_muted "#767676"; set -g @theme_accent "#f25f72"; set -g @theme_branch "#767676"; set -g @theme_git "#7dc62c"; set -g @theme_time "#ffff28"; set -g @theme_border "#3a3a3a"' \
    'set -g @theme_bg "#ffffff"; set -g @theme_fg "#262626"; set -g @theme_muted "#767676"; set -g @theme_accent "#cc102d"; set -g @theme_branch "#767676"; set -g @theme_git "#427b12"; set -g @theme_time "#7f7000"; set -g @theme_border "#c6c6c6"'
